<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minilog AR – Test</title>
<script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@2.8.0/dist.es5+umd/msgpack.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root{--red:#e30613;--ink:#1d1d1b;--bg:rgba(255,255,255,.94);--muted:#6b6b6b}
  /* kein Hintergrund auf body: MindAR legt das Kamerabild mit negativem z-index dahinter */
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent;color:var(--ink)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
       padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--bg);font-size:13px}
  #bar b{color:var(--red)}
  #bar a,#bar select{font:inherit;padding:5px 9px;border-radius:14px;border:1px solid #ccc;background:#fff;color:var(--ink);text-decoration:none}
  #bar a.on{background:var(--red);border-color:var(--red);color:#fff}
  #metrics{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:20;background:var(--bg);
       border-radius:10px;padding:8px 10px;font:12px/1.45 ui-monospace,Menlo,monospace;max-width:calc(100% - 16px);box-sizing:border-box}
  #metrics .big{font:600 15px system-ui;color:var(--red)}
  #metrics button{font:inherit;margin-top:4px;padding:3px 8px;border-radius:8px;border:1px solid #ccc;background:#fff}
  .a-enter-vr,.a-enter-ar,.a-enter-vr-button,.a-enter-ar-button{display:none!important}
  /* Produktkarte (Bottom Sheet) */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.3);
       padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);max-height:60vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease}
  #sheet.open{transform:none}
  #sheet .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:24px;line-height:1;color:var(--muted);padding:6px}
  #sheet .name{font-weight:700;font-size:16px;padding-right:30px}
  #sheet .code{display:inline-block;background:#e9e9e9;padding:1px 6px;border-radius:3px;font-size:12px;margin:4px 0 6px}
  #sheet .desc{font-size:13px;color:#444;margin:0 0 8px}
  #sheet .draw{display:block;width:100%;max-height:24vh;object-fit:contain;background:#fafafa;border:1px solid #eee;border-radius:8px}
  #sheet select{width:100%;font:inherit;font-size:13px;padding:7px;border-radius:8px;border:1px solid #ccc;margin:8px 0;background:#fff;color:var(--ink)}
  #sheet .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  #sheet .btns a{display:block;text-align:center;padding:10px 4px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;color:#fff;background:var(--red)}
  #sheet .btns a.sec{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  #sheet .btns a.off{opacity:.35;pointer-events:none}
  #sheet .note{font-size:11px;color:var(--muted);margin-top:6px}
  /* 3D-Viewer (TraceParts) */
  #viewer{position:fixed;inset:0;z-index:40;background:#fff;display:none;flex-direction:column}
  #viewer.open{display:flex}
  #viewer header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid #eee;font-size:14px}
  #viewer header b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #viewer header button{border:0;background:var(--red);color:#fff;border-radius:14px;padding:6px 12px;font:inherit;font-weight:600}
  #viewer iframe{flex:1;border:0;width:100%}
  body.sheet-open #metrics{display:none}
  /* eigener Container mit Stapelkontext: Kamera-Video (z-index -2) liegt sicher sichtbar hinter der 3D-Ebene */
  #ar{position:fixed;inset:0;z-index:0;overflow:hidden}
  #ar video{display:block!important;visibility:visible!important;opacity:1!important}
  #ver{font-size:11px;color:var(--muted);margin-left:auto}
  #loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:15;color:#fff;font-size:15px;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="bar"></div>
<div id="ar"></div>
<div id="loading">Lade Ziele …</div>
<div id="sheet" aria-live="polite">
  <button class="x" onclick="hideCard()" aria-label="Schließen">×</button>
  <div class="name"></div><div class="code"></div>
  <p class="desc"></p>
  <img class="draw" alt="Technische Zeichnung">
  <select class="variant" aria-label="Variante"></select>
  <div class="btns">
    <a class="b3d" href="#" onclick="open3D(event)">3D-Modell</a>
    <a class="bpdf sec" target="_blank" rel="noopener">Zeichnung PDF</a>
    <a class="bshop sec" target="_blank" rel="noopener">Im Shop</a>
  </div>
  <div class="note"></div>
</div>
<div id="viewer"><header><b></b><button onclick="close3D()">Zurück zur AR</button></header><iframe title="3D-Modell" allow="fullscreen; xr-spatial-tracking"></iframe></div>
<div id="metrics"></div>
<script>
/* ---------- Konfiguration ---------- */
const CHAPTERS = {
  protection: {label:'Protection', from:5, to:22},
  // electronics:{label:'Electronics',from:23,to:32}, access:{...}, machine:{...}, fasteners:{...}
};
const ALL_PAGES = Array.from({length:68},(_,i)=>i+1);
const ASPECT = 905/640;           // Höhe/Breite der Zielbilder

const q = new URLSearchParams(location.search);
const mode = ['spread','chapter','all'].includes(q.get('mode')) ? q.get('mode') : 'chapter';
const chapKey = CHAPTERS[q.get('c')] ? q.get('c') : 'protection';
const chap = CHAPTERS[chapKey];
const s = parseInt(q.get('s') || chap.from, 10);
const pad = n => String(n).padStart(2,'0');
/* Glättung (One-Euro-Filter): cf klein = ruhiger im Stand, beta groß = weniger Nachlaufen bei Bewegung. Per URL testbar: &cf=0.0001&beta=10 */
const CF = parseFloat(q.get('cf') || '0.0001'), BETA = parseFloat(q.get('beta') || '10');

/* Doppelseite: links gerade, rechts ungerade (4|5, 6|7 …) */
function spreadOf(p){ const l = p % 2 === 0 ? p : p-1; return [l, l+1].filter(x => x>=1 && x<=68); }
let pages;
if (mode==='spread') pages = spreadOf(s);
else if (mode==='chapter') pages = Array.from({length:chap.to-chap.from+1},(_,i)=>chap.from+i);
else pages = ALL_PAGES;

/* ---------- UI: Modus-Leiste ---------- */
const bar = document.getElementById('bar');
const link = (m, extra='') => `?mode=${m}&c=${chapKey}${extra}`;
let spreadOpts = '';
for (let p = chap.from - (chap.from%2); p <= chap.to; p += 2) {
  const sp = spreadOf(p); spreadOpts += `<option value="${sp[0]}" ${sp.includes(s)?'selected':''}>S. ${sp.join('|')}</option>`;
}
bar.innerHTML = `<b>Minilog AR</b>
  <a class="${mode==='spread'?'on':''}" href="${link('spread','&s='+s)}">Doppelseite</a>
  <a class="${mode==='chapter'?'on':''}" href="${link('chapter')}">Kapitel</a>
  <a class="${mode==='all'?'on':''}" href="${link('all')}">Alle 68</a>
  ${mode==='spread'?`<select onchange="location.search='${link('spread')}&s='+this.value">${spreadOpts}</select>`:''}
  <span id="ver">v8</span>`;

/* ---------- Messwerte ---------- */
const t0 = performance.now();
const M = {mode, targets: pages.length, bytes:0, download:null, arReady:null, firstFound:null, found:[]};
const ms = v => v==null ? '–' : (v/1000).toFixed(1)+' s';
function renderMetrics(){
  const last = M.found[M.found.length-1];
  document.getElementById('metrics').innerHTML =
    `<div class="big">${last ? 'Erkannt: Seite '+last.page : 'Suche Seite …'}</div>
     Modus: ${mode} · ${M.targets} Ziele · cf ${CF} β ${BETA} · ${(M.bytes/1048576).toFixed(1)} MB<br>
     Download+Merge: ${ms(M.download)} · Kamera bereit: ${ms(M.arReady)}<br>
     1. Erkennung: ${ms(M.firstFound)} · Erkennungen: ${M.found.length}
     ${M.found.length? '<br>Verlauf: '+M.found.slice(-8).map(f=>f.page).join(' → '):''}
     <br><button onclick="copyMetrics()">Messwerte kopieren</button>`;
}
function copyMetrics(){
  const txt = `Minilog AR Test | ${navigator.userAgent}\nModus ${mode}, ${M.targets} Ziele, ${(M.bytes/1048576).toFixed(1)} MB\n`+
    `Download ${ms(M.download)}, Kamera bereit ${ms(M.arReady)}, 1. Erkennung ${ms(M.firstFound)}\n`+
    `Erkannte Seiten: ${M.found.map(f=>f.page+'@'+(f.t/1000).toFixed(1)+'s').join(', ')}`;
  navigator.clipboard?.writeText(txt).then(()=>alertLite('Kopiert'),()=>prompt('Messwerte:',txt));
}
function alertLite(t){ const el=document.querySelector('#metrics .big'); const o=el.textContent; el.textContent=t; setTimeout(()=>el.textContent=o,1200); }
renderMetrics();

/* ---------- Produktdaten (PIM) ---------- */
const IMG = 'https://storacesswebpraisstibprd.blob.core.windows.net/stiboassets/D365_800X800_MAX_JPG/std.lang.all/D365_800X800_MAX_JPG!';
const PDF = 'https://storacesswebpraisstibprd.blob.core.windows.net/stiboassets/D365_DOCS_PDF/std.lang.all/D365_DOCS_PDF!';
const TP3D = 'https://www.traceparts.com/els/essentra-components/en/api/viewer/3d?SupplierID=ESSENTRA_COMPONENTS&PartNumber=';
let PRODUCTS = null;
const productsReady = fetch('products.json').then(r=>r.json()).then(j=>PRODUCTS=j).catch(()=>PRODUCTS={});

/* ---------- Produktkarte ---------- */
const sheet = document.getElementById('sheet');
let cur = null;   // {h, p, v}
async function showCard(h){
  await productsReady;
  const p = PRODUCTS[h.code];
  sheet.querySelector('.name').textContent = h.name || 'Produkt';
  sheet.querySelector('.code').textContent = h.code + (p ? ` · ${p.v.length} Variante${p.v.length>1?'n':''}` : '');
  sheet.querySelector('.desc').textContent = p?.x || '';
  const sel = sheet.querySelector('.variant');
  sel.innerHTML = '';
  if (p && p.v.length) {
    p.v.forEach((v,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${v.t} (${v.s})`; sel.appendChild(o); });
    // Startvariante: eine mit Zeichnung, sonst die erste
    const start = Math.max(0, p.v.findIndex(v=>v.d));
    sel.value = start; sel.style.display = p.v.length>1 ? '' : 'none';
    sel.onchange = () => setVariant(h, p, p.v[sel.value]);
    setVariant(h, p, p.v[start]);
  } else {
    sel.style.display='none'; cur = {h, p:null, v:null};
    sheet.querySelector('.draw').style.display='none';
    ['.b3d','.bpdf'].forEach(c=>sheet.querySelector(c).classList.add('off'));
    const shop=sheet.querySelector('.bshop'); shop.classList.add('off');
    sheet.querySelector('.note').textContent = 'Für diese Serie sind im PIM-Export noch keine Daten hinterlegt.';
  }
  sheet.classList.add('open'); document.body.classList.add('sheet-open');
}
function setVariant(h, p, v){
  cur = {h, p, v};
  const img = sheet.querySelector('.draw');
  const fallback = p.v.find(x=>x.d);      // Serienzeichnung, falls Variante keine eigene hat
  const id = v.d || fallback?.d || v.i;
  if (id) { img.src = IMG + encodeURIComponent(id) + '.jpg'; img.style.display=''; img.alt = v.d||fallback ? 'Technische Zeichnung' : 'Produktbild'; }
  else img.style.display='none';
  img.onerror = () => { if (v.i && !img.src.includes(encodeURIComponent(v.i))) img.src = IMG + encodeURIComponent(v.i) + '.jpg'; else img.style.display='none'; };
  const b3d = sheet.querySelector('.b3d'); b3d.classList.toggle('off', !v.s);
  const pdf = sheet.querySelector('.bpdf');
  if (v.p) { pdf.href = PDF + encodeURIComponent(v.p) + '.pdf'; pdf.classList.remove('off'); } else { pdf.removeAttribute('href'); pdf.classList.add('off'); }
  const shop = sheet.querySelector('.bshop');
  const url = p.f ? (v.u ? `${p.f}/${v.s}` : p.f) : '';
  if (url) { shop.href = url; shop.classList.remove('off'); } else { shop.removeAttribute('href'); shop.classList.add('off'); }
  sheet.querySelector('.note').textContent = `Artikel ${v.s} · Daten aus PIM-Export`;
}
function hideCard(){ sheet.classList.remove('open'); document.body.classList.remove('sheet-open'); document.querySelectorAll('.model').forEach(m=>m.remove()); }
function open3D(e){
  e.preventDefault(); if (!cur?.v) return;
  const vw = document.getElementById('viewer');
  vw.querySelector('b').textContent = `${cur.v.t} (${cur.v.s})`;
  vw.querySelector('iframe').src = TP3D + encodeURIComponent(cur.v.s);
  vw.classList.add('open');
}
function close3D(){ const vw=document.getElementById('viewer'); vw.classList.remove('open'); vw.querySelector('iframe').src='about:blank'; }

/* ---------- Antippen: Ring markieren, optional eigenes GLB (models/<code>.glb) ---------- */
// models/index.json: { "SR1055": "<Artikel des Modells>", … } – aus STEP-Daten konvertiert
const MODELS = fetch('models/index.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
async function hasGlb(code){ return !!(await MODELS)[code]; }
async function onHotspot(anchor, h, x, y){
  anchor.querySelectorAll('.model').forEach(m=>m.remove());
  const dot = document.createElement('a-circle');      // gefüllter Punkt = ausgewählt
  dot.setAttribute('radius','0.022'); dot.setAttribute('color','#e30613'); dot.setAttribute('position',`${x} ${y} 0.007`); dot.classList.add('model');
  anchor.appendChild(dot);
  showCard(h);
  if (await hasGlb(h.code)) {
    // Modell ist auf 1 Einheit normiert -> 0,16 Seitenbreiten (~3,4 cm), schwebt geneigt über dem Produkt und dreht sich
    const g = document.createElement('a-entity'); g.classList.add('model');
    g.setAttribute('position', `${x} ${y} 0.1`); g.setAttribute('rotation','15 0 0');   // Modelle sind so exportiert, dass die große Fläche zur Kamera zeigt
    g.setAttribute('animation__pop','property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 350; easing: easeOutBack');
    g.innerHTML = `<a-entity gltf-model="models/${h.code}.glb" scale="0.16 0.16 0.16" rotation="0 -40 0" animation="property: rotation; from: 0 -40 0; to: 0 40 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"></a-entity>`;
    anchor.appendChild(g);
    const sku = (await MODELS)[h.code];
    const note = sheet.querySelector('.note'); note.textContent = `Artikel ${cur?.v?.s||''} · 3D über dem Heft zeigt Serienmodell (Artikel ${sku})`;
  }
}

/* ---------- .mind-Dateien laden und zusammenführen ---------- */
async function mergedTargets(list){
  const parts = await Promise.all(list.map(async p => {
    const r = await fetch(`targets/p${pad(p)}.mind`); if(!r.ok) throw new Error('fehlt: p'+pad(p));
    const b = new Uint8Array(await r.arrayBuffer()); M.bytes += b.length; return b;
  }));
  const dataList = [];
  for (const b of parts) dataList.push(...MessagePack.decode(b).dataList);
  return URL.createObjectURL(new Blob([MessagePack.encode({v:2, dataList})]));
}

(async () => {
  let hotspots = {};
  try { hotspots = await (await fetch('hotspots.json')).json(); } catch(e){}
  let src;
  try { src = await mergedTargets(pages); }
  catch(e){ document.getElementById('loading').textContent = 'Fehler beim Laden: '+e.message; return; }
  M.download = performance.now()-t0; renderMetrics();
  document.getElementById('loading').style.display = 'none';   // Kamera-Dialog nicht verdecken

  const scene = document.createElement('a-scene');
  scene.setAttribute('mindar-image', {imageTargetSrc: src, maxTrack: 1, uiScanning: 'no', uiLoading: 'no', filterMinCF: CF, filterBeta: BETA});
  scene.setAttribute('color-space','sRGB');
  scene.setAttribute('renderer','colorManagement: true, physicallyCorrectLights');
  scene.setAttribute('vr-mode-ui','enabled: false');
  scene.setAttribute('device-orientation-permission-ui','enabled: false');
  scene.innerHTML = `<a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>
    <a-light type="ambient" intensity="0.9"></a-light><a-light type="directional" position="0.5 1 1" intensity="1.6"></a-light><a-light type="directional" position="-1 -0.5 0.8" intensity="0.5"></a-light>`;

  pages.forEach((page, i) => {
    const t = document.createElement('a-entity');
    t.setAttribute('mindar-image-target', `targetIndex: ${i}`);
    (hotspots[page]||[]).forEach(h => {
      const x = h.u - 0.5, y = (0.5 - h.v) * ASPECT;
      const ring = document.createElement('a-ring');
      ring.setAttribute('radius-inner','0.022'); ring.setAttribute('radius-outer','0.032');
      ring.setAttribute('color','#e30613'); ring.setAttribute('position', `${x} ${y} 0.005`);
      ring.setAttribute('animation','property: scale; from: 1 1 1; to: 1.25 1.25 1; dir: alternate; loop: true; dur: 700');
      const hit = document.createElement('a-circle');   // größere, unsichtbare Klickfläche
      hit.setAttribute('radius','0.06'); hit.setAttribute('material','opacity: 0; transparent: true');
      hit.setAttribute('position', `${x} ${y} 0.006`); hit.classList.add('clickable');
      hit.addEventListener('click', () => onHotspot(t, h, x, y));
      t.appendChild(ring); t.appendChild(hit);
    });
    t.addEventListener('targetFound', () => {
      const tt = performance.now()-t0;
      if (M.firstFound==null) M.firstFound = tt;
      M.found.push({page, t: tt}); renderMetrics();
    });
    t.addEventListener('targetLost', () => { const el=document.querySelector('#metrics .big'); if(el) el.textContent='Suche Seite …'; });
    scene.appendChild(t);
  });
  scene.addEventListener('arReady', () => { M.arReady = performance.now()-t0; document.getElementById('loading').style.display='none'; renderMetrics(); });
  scene.addEventListener('arError', () => { document.getElementById('loading').textContent = 'Kamera nicht verfügbar (HTTPS + Kamerafreigabe nötig).'; });
  scene.setAttribute('embedded', '');
  scene.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
  document.getElementById('ar').appendChild(scene);
})();
</script>
</body>
</html>
